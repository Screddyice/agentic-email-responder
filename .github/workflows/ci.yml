name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run checks
        run: |
          docker run --rm --entrypoint /bin/sh -v "$PWD:/workspace:ro" -w /workspace koalaman/shellcheck-alpine:v0.11.0 -es <<'SHELLCHECK_SCRIPT'
          shellcheck -S warning run-email-responder.sh deploy/deploy-cloud-run.sh
          SHELLCHECK_SCRIPT
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: python:3.13-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run checks
        run: |
          bash -n run-email-responder.sh
          bash -n deploy/deploy-cloud-run.sh
          python3 -m py_compile email-responder.py
          python3 test_recipient_gate.py -v
